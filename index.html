<!DOCTYPE html>
<!--
  HTML5 Standard Document:
  'lang="en"' specifies the primary language of the document, which helps screen
  readers pick the right speech synthesizer and helps search engines index content.
-->
<html lang="en">
<head>
  <!--
    Character Encoding:
    UTF-8 handles virtually all human languages, symbols, and emojis.
    It must be within the first 1024 bytes of the document so the browser
    decodes text properly from the very beginning.
  -->
  <meta charset="UTF-8">

  <!--
    Responsive Viewport Meta Tag:
    Without this, mobile browsers pretend to be a ~980px desktop screen and zoom out,
    making text tiny. 'width=device-width' sets the viewport width to the device's physical
    width, and 'initial-scale=1.0' ensures a 1:1 pixel ratio on first load.
    Note: HTML5 void elements (like <meta>, <link>, <input>) do NOT need a closing slash (/>).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Tracker</title>

  <!--
    External Stylesheet:
    Linking styles via <link> inside <head> ensures styles are loaded and parsed
    before the body renders, preventing a "Flash of Unstyled Content" (FOUC).
  -->
  <link rel="stylesheet" href="styles.css">

  <!--
    Application Script:
    Using 'defer' ensures the script executes only after the HTML document
    is fully parsed, while allowing it to run smoothly on both local 'file:///'
    URLs and web servers without CORS restrictions.
  -->
  <script defer src="app.js"></script>
</head>
<body>
  <!--
    Semantic Landmark: <header>
    Identifies introductory content or site banners. Using semantic landmarks gives
    assistive technology (like screen readers) the ability to jump directly across page sections.
  -->
  <header class="app-header">
    <h1 class="app-title">Task Tracker</h1>
    <p class="app-subtitle">A clean, focused in-memory todo list</p>
  </header>

  <!--
    Semantic Landmark: <main>
    There should be only one visible <main> landmark per document. It represents
    the central, dominant functionality or content of the page.
  -->
  <main class="app-main">
    <!--
      Semantic Landmark: <section>
      HTML rules state a <section> must have an identifiable heading.
      We connect this section to its heading using 'aria-labelledby="tracker-heading"'.
    -->
    <section class="tracker-card" aria-labelledby="tracker-heading">
      <!--
        Heading level 2 for the section:
        This heading is visually hidden using CSS (.visually-hidden) because sighted users
        understand the card's purpose from visual context, but screen reader users still
        receive the structural outline heading.
      -->
      <h2 id="tracker-heading" class="visually-hidden">Task Manager</h2>

      <!--
        Form Container:
        Wrapping user inputs in a <form> provides native browser behaviors out of the box:
        1. Submitting via the Enter key works automatically.
        2. Native validation (e.g. 'required') blocks submission if empty.
        3. Allows JavaScript to listen to a single 'submit' event.
      -->
      <form id="todo-form" class="todo-form">
        <!--
          Accessible Form Label:
          Every form control MUST have an accessible name.
          Using 'for="todo-input"' explicitly links this label to the input with 'id="todo-input"'.
          Clicking this label will also automatically focus the input field.
        -->
        <label for="todo-input" class="todo-form__label">Task description</label>

        <!--
          Flex row for input and action button:
          Allows the input field to expand fluidly while the button maintains its intrinsic width.
        -->
        <div class="todo-form__controls">
          <!--
            Text Input:
            - 'required': Prevents empty submissions natively without needing JS validation first.
            - 'autocomplete="off"': Prevents the browser from showing previous search/history popups
              that might visually obstruct the todo list below.
            - 'maxlength="120"': Provides a sensible safeguard against overly long inputs.
          -->
          <input
            type="text"
            id="todo-input"
            name="todo-input"
            class="todo-form__input"
            placeholder="What needs to be done?"
            required
            maxlength="120"
            autocomplete="off"
          >

          <!--
            Submit Button:
            'type="submit"' makes this the default submission button for the parent <form>.
          -->
          <button type="submit" class="btn btn--primary">
            Add Task
          </button>
        </div>
      </form>

      <!--
        Task List Section:
        'aria-live="polite"' tells screen readers to announce additions and removals
        when they occur, but politely waits until the user is not in the middle of typing or speaking.
      -->
      <section class="todo-list-container" aria-label="Current Tasks">
        <ul id="todo-list" class="todo-list" aria-live="polite">
          <!-- Dynamically populated from JavaScript memory via app.js -->
        </ul>

        <!--
          Empty State Message:
          Hidden by default with the native HTML 'hidden' attribute because we currently have sample tasks.
          When the task list is empty, removing 'hidden' will display this friendly message.
        -->
        <p id="empty-state" class="empty-state" hidden>
          No tasks yet. Add one above to get started!
        </p>
      </section>
    </section>
  </main>
</body>
</html>
